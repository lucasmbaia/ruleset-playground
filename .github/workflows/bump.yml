name: bump
on:
  workflow_dispatch:
    inputs:
      tenant:
        required: true
      pin:
        required: false
        default: ""
      action:
        required: true
        default: bump
permissions:
  contents: write
  pull-requests: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: act
        env:
          GH_TOKEN: ${{ github.token }}
          TENANT: ${{ inputs.tenant }}
          PIN: ${{ inputs.pin }}
          ACTION: ${{ inputs.action }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          br="bot/${TENANT}"
          case "$ACTION" in
            bump)
              main_sha=$(gh api "repos/$REPO/git/ref/heads/main" -q .object.sha)
              if ! gh api "repos/$REPO/git/ref/heads/$br" >/dev/null 2>&1; then
                gh api -X POST "repos/$REPO/git/refs" -f ref="refs/heads/$br" -f sha="$main_sha" >/dev/null
              fi
              head=$(gh api "repos/$REPO/git/ref/heads/$br" -q .object.sha)
              content=$(printf 'commit: %s\n' "$PIN" | base64 -w0)
              gh api graphql -f query='mutation($repo:String!,$br:String!,$head:GitObjectID!,$path:String!,$content:Base64String!,$msg:String!){createCommitOnBranch(input:{branch:{repositoryNameWithOwner:$repo,branchName:$br},expectedHeadOid:$head,message:{headline:$msg},fileChanges:{additions:[{path:$path,contents:$content}]}}){commit{oid}}}' -f repo="$REPO" -f br="$br" -f head="$head" -f path="tenants/$TENANT/app.yaml" -f content="$content" -f msg="Pin $TENANT to $PIN"
              [ "$(gh pr list --head "$br" --state open --json number -q length)" != "0" ] || gh pr create --base main --head "$br" --title "Pin $TENANT" --body "Test bump"
              ;;
            update-merge)
              n=$(gh pr list --head "$br" --state open --json number -q ".[0].number")
              gh api -X PUT "repos/$REPO/pulls/$n/update-branch"
              ;;
            update-rebase)
              id=$(gh pr list --head "$br" --state open --json id -q ".[0].id")
              gh api graphql -f query='mutation($id:ID!){updatePullRequestBranch(input:{pullRequestId:$id,updateMethod:REBASE}){pullRequest{headRefOid}}}' -f id="$id"
              ;;
            *) echo "unknown action $ACTION"; exit 1 ;;
          esac
